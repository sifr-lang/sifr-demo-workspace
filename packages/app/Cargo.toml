[package]
name = "sifr-demo-app"
version = "0.1.0"
edition = "2024"
include = [
  "Cargo.toml",
  "sifr.toml",
  "src/**/*.sifr",
  "src/lib.rs"
]

# sifr-managed
[package.metadata.sifr]
manifest = "sifr.toml"
# end sifr-managed

[dependencies]
sifr-demo-core = { workspace = true }
sifr-demo-utils = { workspace = true }
backend-utils = { path = "../backend-utils" }
